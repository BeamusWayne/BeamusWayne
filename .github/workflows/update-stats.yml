name: Update Profile Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Generate GitHub Stats Card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=radical&hide_border=true&bg_color=00000000
          path: profile/github-stats.svg
          token: ${{ secrets.STATS_PAT || github.token }}
          fail_on_error: true

      - name: Generate GitHub Stats Card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=default&hide_border=true&bg_color=00000000
          path: profile/github-stats-light.svg
          token: ${{ secrets.STATS_PAT || github.token }}
          fail_on_error: true

      - name: Generate Top Languages Card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=radical&hide_border=true&bg_color=00000000
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_PAT || github.token }}
          fail_on_error: true

      - name: Generate Top Languages Card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=default&hide_border=true&bg_color=00000000
          path: profile/top-langs-light.svg
          token: ${{ secrets.STATS_PAT || github.token }}
          fail_on_error: true

      - name: Generate Activity Graph (dark)
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: hide_border=true&area=true&color=3B82F6&line=2563EB&point=3B82F6&bg_color=00000000&title_color=ffffff
          output_path: profile/activity-graph.svg
          token: ${{ secrets.STATS_PAT || github.token }}

      - name: Generate Activity Graph (light)
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: theme=react-light&hide_border=true&area=true&color=3B82F6&line=2563EB&point=3B82F6&bg_color=ffffff
          output_path: profile/activity-graph-light.svg
          token: ${{ secrets.STATS_PAT || github.token }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update profile stats SVGs"
          git push
